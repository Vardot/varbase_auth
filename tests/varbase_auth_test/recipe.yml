name: 'Varbase Social Single Sign-On Test'
description: 'Provisions a site for the Varbase Social Single Sign-On automated tests: installs Varbase Social Single Sign-On and a social authentication provider, and opens visitor registration so the sign-on options appear on the register page.'
type: 'Testing'
install:
  - varbase_auth
  - social_auth_google
config:
  actions:
    user.settings:
      simpleConfigUpdate:
        register: visitors_admin_approval
