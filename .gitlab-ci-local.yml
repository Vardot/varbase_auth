# Local reproduction pipeline for gitlab-ci-local (firecow/gitlab-ci-local).
# Self-contained: builds a Drupal 11 site (PHP 8.3, MariaDB) with varbase_auth
# via a Composer path repository, applies the varbase_auth_test recipe (which
# installs the social providers + places the Social Auth login block + opens
# registration), serves it with `drush runserver` and runs the varbase-e2e suite.
#
#   gitlab-ci-local --file .gitlab-ci-local.yml varbase-e2e-test

stages:
  - test

variables:
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  COMPOSER_MEMORY_LIMIT: "-1"
  COMPOSER_ALLOW_SUPERUSER: "1"

varbase-e2e-test:
  stage: test
  image: node:20-bookworm
  services:
    - name: mariadb:10.11
      alias: database
  variables:
    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
    MARIADB_DATABASE: "drupal"
    LAUNCH_URL: "http://127.0.0.1:8888"
    BROWSER: "chromium"
    WEBSHIP_REPORT_DISABLE: "1"
    SITE: "/app"
    DB_URL: "mysql://root@database:3306/drupal"
    PHP_CLI_SERVER_WORKERS: "8"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq lsb-release ca-certificates curl unzip git apt-transport-https >/dev/null
    - curl -sSL https://packages.sury.org/php/apt.gpg -o /etc/apt/trusted.gpg.d/sury-php.gpg
    - echo "deb https://packages.sury.org/php/ $(lsb_release -sc) main" > /etc/apt/sources.list.d/sury-php.list
    - apt-get update -qq
    - apt-get install -y -qq php8.4-cli php8.4-mysql php8.4-gd php8.4-mbstring php8.4-xml php8.4-curl php8.4-zip default-mysql-client >/dev/null
    - php -v | head -n1
    - for i in $(seq 1 60); do mysqladmin --host=database --user=root ping >/dev/null 2>&1 && break; sleep 2; done
    - mysqladmin --host=database --user=root ping
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - cd "$CI_PROJECT_DIR"
    - corepack enable && yarn install
    - ./node_modules/.bin/playwright install --with-deps chromium
    - composer create-project drupal/recommended-project "$SITE" --no-interaction --no-install
    - cd "$SITE"
    - composer config minimum-stability dev
    - composer config prefer-stable true
    - composer config --no-plugins allow-plugins.composer/installers true
    - composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
    - composer config --no-plugins allow-plugins.drupal/core-project-message true
    - composer config repositories.drupal composer https://packages.drupal.org/8
    - composer config repositories.varbase_auth path "$CI_PROJECT_DIR"
    - composer require "drupal/varbase_auth:*" drupal/social_auth_google:~4 drupal/social_auth_facebook:~4 drupal/social_auth_linkedin:~4 drush/drush --no-interaction
    - vendor/bin/drush site:install standard --db-url="$DB_URL" --account-name=webmaster --account-pass=dD.123123ddd --site-name="Varbase Auth Test" -y
    - vendor/bin/drush recipe "$CI_PROJECT_DIR/tests/varbase_auth_test" -y
    - vendor/bin/drush cr
    - chmod -R 777 web/sites/default/files
    - vendor/bin/drush runserver 127.0.0.1:8888 >/tmp/runserver.log 2>&1 &
    - for i in $(seq 1 30); do curl -fsS -o /dev/null "$LAUNCH_URL/user/login" && break; sleep 1; done
    - 'curl -s -o /dev/null -w "login http %{http_code}\n" "$LAUNCH_URL/user/login"'
    - "echo ===RUNSERVER-LOG===; cat /tmp/runserver.log || true"
  script:
    - cd "$CI_PROJECT_DIR"
    - ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
  allow_failure: false
